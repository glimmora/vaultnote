name: vaultnote
description: Encrypted notes app with .vnc container format - offline-first, military-grade encryption
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.16.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Crypto
  pointycastle: ^3.7.3
  argon2: ^1.0.0
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Storage
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.1
  path: ^1.8.3

  # QR
  qr_flutter: ^4.1.0
  qr_code_scanner_plus: ^2.0.0

  # File I/O
  file_picker: ^8.1.2
  share_plus: ^10.0.2
  permission_handler: ^11.3.0

  # UI
  flutter_staggered_grid_view: ^0.7.0
  local_auth: ^2.3.0
  google_fonts: ^6.1.0
  intl: ^0.19.0

  # Utils
  uuid: ^4.4.0
  archive: ^3.4.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  build_runner: ^2.4.7
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
