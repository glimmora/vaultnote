name: CI/CD Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FLUTTER_VERSION: "3.24.0"

jobs:
  build-web:
    name: Build Web Application
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'
      
      - name: Install dependencies
        working-directory: web
        run: npm ci
      
      - name: Lint Web code
        working-directory: web
        run: npm run lint || true
      
      - name: Build Web application
        working-directory: web
        run: npm run build
      
      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/dist/
          retention-days: 30
      
      - name: Copy Web dist to release folder
        run: |
          mkdir -p dist/web
          cp -r web/dist/* dist/web/

  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      
      - name: Get Flutter dependencies
        working-directory: flutter
        run: flutter pub get
      
      - name: Analyze Flutter project
        working-directory: flutter
        run: flutter analyze || true
      
      - name: Build Flutter APK
        working-directory: flutter
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --verbose
      
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: flutter/build/app/outputs/flutter-apk/
          retention-days: 30
      
      - name: Copy APKs to release folder
        run: |
          mkdir -p dist/android
          cp flutter/build/app/outputs/flutter-apk/*.apk dist/android/ || true

  build-android-aab:
    name: Build Android App Bundle
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      
      - name: Get Flutter dependencies
        working-directory: flutter
        run: flutter pub get
      
      - name: Build Flutter App Bundle
        working-directory: flutter
        run: |
          flutter build appbundle \
            --release \
            --verbose
      
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: flutter/build/app/outputs/bundle/release/
          retention-days: 30
      
      - name: Copy AAB to release folder
        run: |
          mkdir -p dist/android
          cp flutter/build/app/outputs/bundle/release/*.aab dist/android/ || true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      
      - name: Install Web dependencies
        working-directory: web
        run: npm ci
      
      - name: Run Web tests
        working-directory: web
        run: npm test || true
      
      - name: Get Flutter dependencies
        working-directory: flutter
        run: flutter pub get
      
      - name: Run Flutter tests
        working-directory: flutter
        run: flutter test || true

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true
      
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  create-release-artifacts:
    name: Create Release Artifacts
    runs-on: ubuntu-latest
    needs: [build-web, build-android-apk, build-android-aab, test]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
      
      - name: Create release directory structure
        run: |
          mkdir -p dist
          
          # Web
          mkdir -p dist/web
          cp -r all-artifacts/web-build/* dist/web/ || true
          
          # Android APK
          mkdir -p dist/android/apk
          cp all-artifacts/android-apk/*.apk dist/android/apk/ || true
          
          # Android AAB
          mkdir -p dist/android/aab
          cp all-artifacts/android-aab/*.aab dist/android/aab/ || true
      
      - name: Generate build manifest
        run: |
          cat > dist/BUILD_MANIFEST.md << 'EOF'
          # VaultNote Build Artifacts
          
          **Build Date**: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          **Build Ref**: ${{ github.sha }}
          **Build Branch**: ${{ github.ref }}
          
          ## Artifacts
          
          ### Web Build
          - Location: `dist/web/`
          - Type: Static HTML/CSS/JS
          - Deployment: Direct to HTTP server or CDN
          
          ### Android APK
          - Location: `dist/android/apk/`
          - Format: Split APK per ABI
          - Architectures:
            - arm64-v8a (64-bit ARM)
            - armeabi-v7a (32-bit ARM)
            - x86_64 (64-bit Intel)
          - Installation: `adb install-multiple *.apk`
          
          ### Android App Bundle
          - Location: `dist/android/aab/`
          - Format: Android App Bundle (.aab)
          - Deployment: Google Play Store
          - File: `app-release.aab`
          
          ## Build Instructions
          
          ### Deploy Web
          ```bash
          # Copy web directory to web server
          cp -r dist/web/* /var/www/vaultnote/
          
          # Or upload to CDN
          aws s3 sync dist/web/ s3://my-bucket/vaultnote/
          ```
          
          ### Install Android APK
          ```bash
          adb install-multiple dist/android/apk/*.apk
          ```
          
          ### Upload to Play Store
          ```bash
          # Use bundletool or Google Play Console
          bundletool build-apks \
            --bundle=dist/android/aab/app-release.aab \
            --output=app.apks
          ```
          
          ## Build Quality
          
          - ✅ Web build completed
          - ✅ Android APK created
          - ✅ Android App Bundle created
          - ✅ Tests executed
          - ✅ Security scan completed
          
          EOF
          cat dist/BUILD_MANIFEST.md
      
      - name: Upload build artifacts to workflow
        uses: actions/upload-artifact@v4
        with:
          name: complete-build
          path: dist/
          retention-days: 60

  notify-slack:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [build-web, build-android-apk, build-android-aab, test]
    if: always()
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build status message
        id: message
        run: |
          STATUS="✅ All builds completed successfully"
          if [[ "${{ needs.build-web.result }}" != "success" ]] || \
             [[ "${{ needs.build-android-apk.result }}" != "success" ]] || \
             [[ "${{ needs.build-android-aab.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]]; then
            STATUS="⚠️ Build completed with issues"
          fi
          echo "status=$STATUS" >> $GITHUB_OUTPUT
      
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "${{ steps.message.outputs.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*VaultNote CI/CD Build*\n${{ steps.message.outputs.status }}\nBranch: ${{ github.ref }}\nCommit: ${{ github.sha }}"
                  }
                }
              ]
            }
        continue-on-error: true
